name: "media"

services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
      - PUID=1000
      - PGID=1000
    volumes:
      - /docker/appdata/qbittorrent:/config
      - /data/torrents:/data/torrents
    ports:
      - "8080:8080"
      - 52855:52855
  bazarr:
    image: ghcr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /data:/data
      - /docker/appdata/bazarr:/config
    ports:
      - "6767:6767"

  overseerr:
    image: sctx/overseerr
    restart: unless-stopped
    depends_on:
      - qbittorrent
    environment:
      - TZ=America/Sao_Paulo
      - PORT=5055
    volumes:
      - /docker/appdata/overseerr:/app/config
    ports:
      - "5055:5055"

  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    restart: unless-stopped
    depends_on:
      - flaresolverr
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /docker/appdata/prowlarr:/config
    ports:
      - "9696:9696"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    volumes:
      - /docker/appdata/flaresolverr:/config
    ports:
      - "8191:8191"

  radarr:
    image: ghcr.io/linuxserver/radarr:latest
    restart: unless-stopped
    depends_on:
      - qbittorrent
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /data:/data
      - /docker/appdata/radarr:/config
    ports:
      - "7878:7878"

  sonarr:
    image: ghcr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    depends_on:
      - qbittorrent
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /data:/data
      - /docker/appdata/sonarr:/config
    ports:
      - "8989:8989"

  plex:
    image: lscr.io/linuxserver/plex:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - DOCKER_MODS=jefflessard/plex-vaapi-amdgpu-mod
    volumes:
      - /docker/appdata/plex/config:/config
      - /docker/appdata/plex/data:/data
      - /docker/appdata/plex/transcode:/transcode
      - /data/media:/data/media
    devices:
      - /dev/dri:/dev/dri
      - /dev/bus/usb:/dev/bus/usb
    network_mode: host
